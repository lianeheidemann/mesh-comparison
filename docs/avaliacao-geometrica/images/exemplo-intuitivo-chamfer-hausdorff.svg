<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc">
<title id="tit">Comparacao intuitiva de Chamfer e Hausdorff entre duas malhas de xicaras</title>
<desc id="desc">Duas xicaras trianguladas. A reconstruida tem alca deformada, com erros localizados. A Chamfer resume as distancias medias; Hausdorff destaca a maior discrepancia.</desc>
<rect width="1200" height="620" rx="24" fill="#f6f8fb"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#26354b">
<text x="600" y="52" font-size="31" font-weight="700" text-anchor="middle">Uma deformação localizada pode passar despercebida na média</text>
<text x="290" y="112" font-size="23" font-weight="700" text-anchor="middle">GT · Referência</text>
<text x="902" y="112" font-size="23" font-weight="700" text-anchor="middle">RM · Reconstrução</text>
</g>
<g fill="#dbe8f1" stroke="#456781" stroke-width="3" stroke-linejoin="round">
<path d="M162 201 L395 201 376 435 Q278 468 181 435Z"/>
<path d="M774 201 L1007 201 988 435 Q890 468 793 435Z"/>
</g>
