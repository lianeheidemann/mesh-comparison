<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Como funciona o SSIM</title>
<desc id="desc">Renderizações correspondentes da Ground Truth e da malha reconstruída são comparadas em regiões locais, considerando luminância, contraste e estrutura, para produzir um índice de semelhança estrutural.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#167c80"/><stop offset="1" stop-color="#2a9d8f"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2d3a" flood-opacity=".08"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8393a2"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="84" y="96" fill="#18313f" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700">SSIM · Structural Similarity Index</text>
<text x="86" y="143" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="23">Compara a semelhança estrutural entre duas imagens correspondentes</text>
<g filter="url(#shadow)">
<rect x="72" y="205" width="448" height="390" rx="24" fill="#fff"/>
<rect x="576" y="205" width="448" height="390" rx="24" fill="#fff"/>
<rect x="1080" y="205" width="448" height="390" rx="24" fill="#fff"/>
</g>
<text x="112" y="256" fill="#18313f" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">1 · Imagens alinhadas</text>
<text x="112" y="292" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="17">Mesmo ângulo, enquadramento e tamanho</text>
<rect x="112" y="326" width="168" height="150" rx="14" fill="#edf2f5"/>
<rect x="300" y="326" width="168" height="150" rx="14" fill="#edf2f5"/>
<g fill="#718795">
<path d="M166 432V388a30 30 0 0 1 60 0v44z"/><path d="M205 389h23v8h-23z"/>
<path d="M354 432v-44a30 30 0 0 1 60 0v44z"/><path d="M393 389h23v8h-23z"/>
</g>
<path d="M174 440h50M362 440h50" stroke="#a8b8c2" stroke-width="4" stroke-linecap="round"/>
<text x="196" y="510" text-anchor="middle" fill="#425b69" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">GT</text>
<text x="384" y="510" text-anchor="middle" fill="#425b69" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">RM</text>
<text x="112" y="552" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="16">Renderizações pareadas por vista</text>
<path d="M529 400h32" stroke="#8393a2" stroke-width="3" marker-end="url(#arrow)"/>
<text x="616" y="256" fill="#18313f" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">2 · Comparação local</text>
<text x="616" y="292" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="17">Janelas avaliam três componentes</text>
<rect x="616" y="332" width="112" height="112" rx="12" fill="#eef3f5" stroke="#b7c6ce"/>
<rect x="748" y="332" width="112" height="112" rx="12" fill="#eef3f5" stroke="#b7c6ce"/>
<g stroke="#c7d2d9" stroke-width="2">
<path d="M653 332v112M690 332v112M616 369h112M616 406h112"/>
<path d="M785 332v112M822 332v112M748 369h112M748 406h112"/>
</g>
<g fill="#6e8592">
<circle cx="672" cy="388" r="25"/><circle cx="804" cy="388" r="25"/>
</g>
<path d="M659 376a22 22 0 0 1 26-10M791 376a22 22 0 0 1 26-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="904" y="360" fill="#286b6d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Luminância</text>
<text x="904" y="397" fill="#286b6d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Contraste</text>
<text x="904" y="434" fill="#286b6d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Estrutura</text>
<text x="616" y="510" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="16">Padrões locais são comparados</text>
<path d="M1033 400h32" stroke="#8393a2" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1120" y="256" fill="#18313f" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">3 · Índice SSIM</text>
<text x="1120" y="292" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="17">As comparações locais formam um escore</text>
<circle cx="1304" cy="402" r="87" fill="#f0f7f6" stroke="#c6e0dc" stroke-width="3"/>
<text x="1304" y="394" text-anchor="middle" fill="#167c80" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">SSIM</text>
<text x="1304" y="432" text-anchor="middle" fill="#526b77" font-family="Inter,Arial,sans-serif" font-size="19">maior → mais semelhante</text>
<text x="1120" y="536" fill="#607582" font-family="Inter,Arial,sans-serif" font-size="16">1 indica imagens idênticas</text>
<rect x="72" y="650" width="1456" height="168" rx="24" fill="#17313f"/>
<text x="112" y="706" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Como interpretar</text>
<text x="112" y="754" fill="#d5e2e8" font-family="Inter,Arial,sans-serif" font-size="20">SSIM alto significa que luminância, contraste e estrutura estão mais próximos entre GT e RM.</text>
<text x="112" y="786" fill="#a9c0ca" font-family="Inter,Arial,sans-serif" font-size="17">É uma métrica das renderizações; iluminação, câmera, máscaras e enquadramento também influenciam o resultado.</text>
<rect x="1315" y="682" width="166" height="92" rx="16" fill="#244955"/>
<text x="1398" y="718" text-anchor="middle" fill="#b8e3dc" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">DIREÇÃO</text>
<text x="1398" y="755" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">maior é melhor</text>
</svg>