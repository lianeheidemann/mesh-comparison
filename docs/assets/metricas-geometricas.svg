<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Como são calculadas as métricas geométricas</title>
<desc id="desc">O protocolo amostra as malhas de referência e reconstruída, calcula distâncias ponto-superfície e delas obtém métricas geométricas, cobertura e consistência de normais.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54758c"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1d3448}
    .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#526b7e}
    .head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#425c70}
    .small{font-size:14px;fill:#526b7e}.tag{font-size:13px;font-weight:700;letter-spacing:.5px}
  </style>
</defs>
<rect width="1200" height="650" rx="24" fill="#f3f7fa"/>
<text x="48" y="58" class="title">Métricas geométricas: da malha aos indicadores</text>
<text x="48" y="88" class="sub">A comparação usa amostras da superfície e mede cada ponto até os triângulos da outra malha.</text>

<rect x="48" y="125" width="290" height="96" rx="16" fill="#fff" stroke="#c9d8e2" stroke-width="2"/>
<text x="70" y="160" class="tag" fill="#356f91">REFERÊNCIA</text>
<text x="70" y="190" class="head">GT • verdade de referência</text>
<circle cx="282" cy="157" r="5" fill="#356f91"/><circle cx="300" cy="170" r="5" fill="#356f91"/><circle cx="278" cy="190" r="5" fill="#356f91"/>

<rect x="48" y="245" width="290" height="96" rx="16" fill="#fff" stroke="#b8ddd6" stroke-width="2"/>
<text x="70" y="280" class="tag" fill="#18877b">RECONSTRUÇÃO</text>
<text x="70" y="310" class="head">RM • malha avaliada</text>
<circle cx="282" cy="277" r="5" fill="#18877b"/><circle cx="300" cy="290" r="5" fill="#18877b"/><circle cx="278" cy="310" r="5" fill="#18877b"/>

<path d="M338 173 H378 V228 H404" fill="none" stroke="#54758c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M338 293 H378 V238 H404" fill="none" stroke="#54758c" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="410" y="150" width="305" height="170" rx="18" fill="#e4eef5" stroke="#9cb8c9" stroke-width="2"/>
<text x="435" y="188" class="tag" fill="#356f91">DISTÂNCIA PONTO-SUPERFÍCIE</text>
<text x="435" y="223" class="head">Amostra → triângulo mais próximo</text>
<text x="435" y="253" class="body">Calculada nos dois sentidos:</text>
<text x="435" y="280" class="body">GT → RM  •  RM → GT</text>
<text x="435" y="304" class="small">100 mil amostras por malha</text>

<path d="M715 235 H755 V165 H786" fill="none" stroke="#54758c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M755 235 V275 H786" fill="none" stroke="#54758c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M755 235 V405 H786" fill="none" stroke="#54758c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M755 235 V535 H786" fill="none" stroke="#54758c" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="792" y="125" width="360" height="82" rx="15" fill="#fff" stroke="#c9d8e2" stroke-width="2"/>
<text x="816" y="158" class="head">Erro médio e discrepâncias</text>
<text x="816" y="185" class="body">Chamfer  •  HD95  <tspan fill="#18877b" font-weight="700">↓ menor é melhor</tspan></text>

<rect x="792" y="235" width="360" height="82" rx="15" fill="#fff" stroke="#c9d8e2" stroke-width="2"/>
<text x="816" y="268" class="head">Proximidade e cobertura</text>
<text x="816" y="295" class="body">Precisão + recall → F-score @τ</text>

<rect x="792" y="365" width="360" height="82" rx="15" fill="#fff" stroke="#c9d8e2" stroke-width="2"/>
<text x="816" y="398" class="head">Várias tolerâncias</text>
<text x="816" y="425" class="body">Curva F(τ) → AUC-F <tspan fill="#18877b" font-weight="700">↑ maior é melhor</tspan></text>

<rect x="792" y="495" width="360" height="82" rx="15" fill="#fff" stroke="#c9d8e2" stroke-width="2"/>
<text x="816" y="528" class="head">Orientação local</text>
<text x="816" y="555" class="body">Consistência de normais (NC) <tspan fill="#18877b" font-weight="700">↑</tspan></text>

<rect x="48" y="390" width="667" height="150" rx="18" fill="#fff" stroke="#c9d8e2" stroke-width="2"/>
<text x="74" y="428" class="tag" fill="#356f91">COMO LER OS RESULTADOS</text>
<text x="74" y="463" class="body">τ é uma fração da diagonal da caixa delimitadora da GT.</text>
<text x="74" y="492" class="body">As métricas também podem ser separadas em regiões visíveis</text>
<text x="74" y="519" class="body">e ocultas quando a câmera da imagem de entrada é conhecida.</text>

<text x="48" y="612" class="small">As setas indicam o fluxo de cálculo; Chamfer e HD95 usam as duas direções.</text>
</svg>