<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
  <title id="title">Mesh Comparison</title>
  <desc id="desc">Duas malhas trianguladas comparadas por três correspondências verticais animadas.</desc>
  <defs>
    <linearGradient id="upperSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EFFB"/>
      <stop offset="1" stop-color="#AEC6E2"/>
    </linearGradient>
    <linearGradient id="lowerSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31679A"/>
      <stop offset="1" stop-color="#173A62"/>
    </linearGradient>
    <linearGradient id="matchSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43B9FF"/>
      <stop offset="1" stop-color="#1B8FE4"/>
    </linearGradient>
    <style>
      .mesh-line { fill:none; stroke:#09274A; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
      .vertex { fill:#F8FBFF; stroke:#09274A; stroke-width:9; }
      .match-line { fill:none; stroke:#32B5FF; stroke-width:6; stroke-linecap:round; stroke-dasharray:8 13; animation: dash-flow 1.6s linear infinite; }
      .match-line:nth-of-type(2) { animation-delay:.35s; }
      .match-line:nth-of-type(3) { animation-delay:.7s; }
      .match-face { animation: face-pulse 3s ease-in-out infinite; }
      .signal { opacity:0; }
      .signal-a { animation: signal-a 1.7s ease-in-out infinite; }
      .signal-b { animation: signal-b 1.7s ease-in-out .35s infinite; }
      .signal-c { animation: signal-c 1.7s ease-in-out .7s infinite; }
      @keyframes dash-flow { to { stroke-dashoffset:-42; } }
      @keyframes face-pulse { 0%,100% { opacity:.55; } 50% { opacity:.95; } }
      @keyframes signal-a { 0% { opacity:0; transform:translateY(0); } 12%,82% { opacity:1; } 100% { opacity:0; transform:translateY(231px); } }
      @keyframes signal-b { 0% { opacity:0; transform:translateY(0); } 12%,82% { opacity:1; } 100% { opacity:0; transform:translateY(220px); } }
      @keyframes signal-c { 0% { opacity:0; transform:translateY(0); } 12%,82% { opacity:1; } 100% { opacity:0; transform:translateY(224px); } }
      @media (prefers-reduced-motion: reduce) {
        .match-line, .signal, .match-face { animation:none !important; }
        .signal { display:none; }
      }
    </style>
  </defs>

  <!-- The two triangulated surfaces -->
  <g aria-hidden="true">
    <path d="M86 220 L232 138 L375 62 L505 139 L580 218 L465 250 L360 232 L235 259 Z" fill="url(#upperSurface)"/>
    <path d="M86 220 L235 259 L360 232 L465 250 L580 218 L465 270 L360 258 L235 277 Z" fill="#D3E3F4" opacity=".65"/>
    <path d="M86 440 L232 382 L375 318 L505 382 L580 440 L465 474 L360 452 L235 490 Z" fill="url(#lowerSurface)"/>
    <path d="M86 440 L235 490 L360 452 L465 474 L580 440 L465 500 L360 480 L235 520 Z" fill="#12345A" opacity=".72"/>

    <!-- Matching regions -->
    <path class="match-face" d="M360 232 L465 250 L235 277 Z" fill="url(#matchSurface)" opacity=".82">
      
    </path>
    <path class="match-face" d="M235 490 L360 452 L360 480 Z" fill="#55BEFF" opacity=".9">
      
    </path>

    <!-- Upper mesh edges -->
    <path class="mesh-line" d="M86 220 L232 138 L375 62 L505 139 L580 218 L465 250 L360 232 L235 259 Z"/>
    <path class="mesh-line" d="M232 138 L235 259 M375 62 L360 232 M505 139 L465 250 M86 220 L360 232 M232 138 L360 232 M375 62 L360 232 M505 139 L360 232 M580 218 L360 232 M235 259 L360 232 M235 259 L465 250"/>
    <!-- Lower mesh edges -->
    <path class="mesh-line" d="M86 440 L232 382 L375 318 L505 382 L580 440 L465 474 L360 452 L235 490 Z"/>
    <path class="mesh-line" d="M232 382 L235 490 M375 318 L360 452 M505 382 L465 474 M86 440 L360 452 M232 382 L360 452 M375 318 L360 452 M505 382 L360 452 M580 440 L360 452 M235 490 L360 452 M235 490 L465 474"/>

    <!-- Animated vertex correspondences -->
    <g>
      <path class="match-line" d="M235 259 L235 490">
        
      </path>
      <path class="match-line" d="M360 232 L360 452">
        
      </path>
      <path class="match-line" d="M465 250 L465 474">
        
      </path>
      <circle class="signal signal-a" cx="235" cy="259" r="6" fill="#55C5FF">
        
        
      </circle>
      <circle class="signal signal-b" cx="360" cy="232" r="6" fill="#55C5FF">
        
        
      </circle>
      <circle class="signal signal-c" cx="465" cy="250" r="6" fill="#55C5FF">
        
        
      </circle>
    </g>

    <!-- Vertices -->
    <g>
      <circle class="vertex" cx="86" cy="220" r="16"/><circle class="vertex" cx="232" cy="138" r="16"/>
      <circle class="vertex" cx="375" cy="62" r="16"/><circle class="vertex" cx="505" cy="139" r="16"/>
      <circle class="vertex" cx="580" cy="218" r="16"/><circle class="vertex" cx="465" cy="250" r="16"/>
      <circle class="vertex" cx="360" cy="232" r="16"/><circle class="vertex" cx="235" cy="259" r="16"/>
      <circle class="vertex" cx="86" cy="440" r="16"/><circle class="vertex" cx="232" cy="382" r="16"/>
      <circle class="vertex" cx="375" cy="318" r="16"/><circle class="vertex" cx="505" cy="382" r="16"/>
      <circle class="vertex" cx="580" cy="440" r="16"/><circle class="vertex" cx="465" cy="474" r="16"/>
      <circle class="vertex" cx="360" cy="452" r="16"/><circle class="vertex" cx="235" cy="490" r="16"/>
    </g>
  </g>
</svg>
