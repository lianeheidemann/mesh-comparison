<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 545" role="img" aria-labelledby="title desc">
  <title id="title">How the Mesh Comparison code works</title>
  <desc id="desc">GT and RM meshes go through shared preparation (common), then the geometric and perceptual pipelines, which write CSV, PLY and PNG files to the output folder. The desktop app (gui) selects the meshes, starts the pipelines and reads the outputs; the command-line tools (cli) and the analysis package handle GT datasets, checks, validation studies and figures.</desc>
  <style>
    :root { color-scheme: light dark; --text:#27384c; --muted:#536a82; --card:#ffffff; --accent:#dfe9f4; --line:#7089a5; --arrow:#56708c; --blue:#356487; --orange:#c87856; }
    @media (prefers-color-scheme: dark) { :root { --text:#e6edf3; --muted:#9fb1c3; --card:#161b22; --accent:#1f3550; --line:#5f7f9f; --arrow:#8aa4bd; --blue:#6fb0dc; --orange:#e59a78; } }
    text { font-family:Arial,sans-serif; fill:var(--text); }
    .muted { fill:var(--muted); }
    .module { fill:var(--blue); font-family:Consolas,Menlo,monospace; }
    .card { fill:var(--card); stroke:var(--line); stroke-width:2; }
    .accent { fill:var(--accent); stroke:var(--line); stroke-width:2; }
    .arrow { fill:none; stroke:var(--arrow); stroke-width:2.5; marker-end:url(#arrow); }
    .dashed { stroke-dasharray:7 5; }
    .gt { fill:var(--blue); }
    .rm { fill:var(--orange); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--arrow)"/></marker>
  </defs>
  <text x="560" y="36" text-anchor="middle" font-size="24" font-weight="bold">How the Code Works</text>
  <text x="560" y="62" text-anchor="middle" class="muted" font-size="14">Packages of src/meshcomparison/ and how a GT/RM pair flows through them</text>

  <!-- evaluation flow -->
  <rect class="card" x="24" y="120" width="200" height="170" rx="12"/>
  <text x="124" y="150" text-anchor="middle" font-size="17" font-weight="bold">Input meshes</text>
  <text x="124" y="177" text-anchor="middle" font-size="15"><tspan class="gt">GT</tspan><tspan> + </tspan><tspan class="rm">RM</tspan></text>
  <text x="124" y="208" text-anchor="middle" class="muted" font-size="13">GT: GSO or curated set</text>
  <text x="124" y="228" text-anchor="middle" class="module" font-size="12">datasets/</text>
  <text x="124" y="256" text-anchor="middle" class="muted" font-size="13">RM: image-to-3D output</text>
  <text x="124" y="276" text-anchor="middle" class="muted" font-size="12">STL · OBJ · PLY · GLB</text>

  <path class="arrow" d="M225 205H245"/>
  <rect class="accent" x="250" y="120" width="250" height="170" rx="12"/>
  <text x="375" y="150" text-anchor="middle" font-size="17" font-weight="bold">Shared preparation</text>
  <text x="375" y="170" text-anchor="middle" class="module" font-size="12">common/</text>
  <text x="375" y="203" text-anchor="middle" class="muted" font-size="14">Load · normalize (GT diagonal)</text>
  <text x="375" y="228" text-anchor="middle" class="muted" font-size="14">100k surface samples per mesh</text>
  <text x="375" y="253" text-anchor="middle" class="muted" font-size="14">Similarity ICP if MSE &gt; 1e-4</text>

  <path class="arrow" d="M501 205H516V152H530"/>
  <path class="arrow" d="M516 205V257H530"/>

  <rect class="card" x="535" y="110" width="290" height="85" rx="12"/>
  <text x="680" y="136" text-anchor="middle" font-size="17" font-weight="bold">Geometric pipeline <tspan class="module" font-size="12" font-weight="normal">geometry/</tspan></text>
  <text x="680" y="161" text-anchor="middle" class="muted" font-size="13">Chamfer · HD95 · F-score · AUC-F · NC</text>
  <text x="680" y="182" text-anchor="middle" class="muted" font-size="13">Visible / hidden regions · heatmap</text>

  <rect class="card" x="535" y="215" width="290" height="85" rx="12"/>
  <text x="680" y="241" text-anchor="middle" font-size="17" font-weight="bold">Perceptual pipeline <tspan class="module" font-size="12" font-weight="normal">perceptual/</tspan></text>
  <text x="680" y="266" text-anchor="middle" class="muted" font-size="13">100 orthographic views</text>
  <text x="680" y="287" text-anchor="middle" class="muted" font-size="13">LPIPS · PSNR · SSIM</text>

  <path class="arrow" d="M826 152H846V190H865"/>
  <path class="arrow" d="M826 257H846V220H865"/>
  <rect class="accent" x="870" y="140" width="226" height="130" rx="12"/>
  <text x="983" y="170" text-anchor="middle" font-size="17" font-weight="bold">Output folder</text>
  <text x="983" y="198" text-anchor="middle" class="muted" font-size="13">metrics/ CSV · aligned/ PLY</text>
  <text x="983" y="221" text-anchor="middle" class="muted" font-size="13">renders/ · heatmaps/ PNG</text>
  <text x="983" y="244" text-anchor="middle" class="muted" font-size="13">figures/ PNG</text>

  <!-- entry points and tools -->
  <path class="arrow" d="M120 378V296"/>
  <text x="130" y="340" class="muted" font-size="12">selects, starts</text>
  <path class="arrow dashed" d="M983 271V350H230V373"/>
  <text x="600" y="343" text-anchor="middle" class="muted" font-size="12">reads results</text>

  <rect class="card" x="24" y="378" width="340" height="112" rx="12"/>
  <text x="194" y="406" text-anchor="middle" font-size="17" font-weight="bold">Desktop app <tspan class="module" font-size="12" font-weight="normal">gui/</tspan></text>
  <text x="194" y="431" text-anchor="middle" class="muted" font-size="13">Runs each pipeline in a child process</text>
  <text x="194" y="452" text-anchor="middle" class="muted" font-size="13">Results tabs: tables, images, figures</text>
  <text x="194" y="473" text-anchor="middle" class="muted" font-size="13">3D view of GT, aligned RM and heatmap</text>

  <rect class="card" x="390" y="378" width="340" height="112" rx="12"/>
  <text x="560" y="406" text-anchor="middle" font-size="17" font-weight="bold">Command line <tspan class="module" font-size="12" font-weight="normal">cli/</tspan></text>
  <text x="560" y="431" text-anchor="middle" class="muted" font-size="13">mesh-* commands or python scripts/…</text>
  <text x="560" y="452" text-anchor="middle" class="muted" font-size="13">check_gt · fetch_gso · plot_metrics</text>
  <text x="560" y="473" text-anchor="middle" class="muted" font-size="13">robustness_study · icp_study</text>

  <rect class="card" x="756" y="378" width="340" height="112" rx="12"/>
  <text x="926" y="406" text-anchor="middle" font-size="17" font-weight="bold">Analysis <tspan class="module" font-size="12" font-weight="normal">analysis/</tspan></text>
  <text x="926" y="431" text-anchor="middle" class="muted" font-size="13">GT checks (holes, bases, hidden faces)</text>
  <text x="926" y="452" text-anchor="middle" class="muted" font-size="13">Robustness and ICP validation studies</text>
  <text x="926" y="473" text-anchor="middle" class="muted" font-size="13">Metric figures, also saved by each run</text>

  <text x="560" y="524" text-anchor="middle" class="muted" font-size="14">Both pipelines write into the selected output folder (both export the same aligned/rm_aligned.ply); use a new folder for each experiment.</text>
</svg>
