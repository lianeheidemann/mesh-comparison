<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img"><style>
:root{color-scheme:light dark;--bg:#f7f9fb;--ink:#27384c;--sub:#344b60;--mute:#536a82;--box:#ffffff;--hl:#dfe9f4;--line:#7089a5;--arrow:#56708c;--gt:#356487;--rm:#c87856;--gtfill:#aac2d7;--node:#537a9a;--guide:#9ab0c1;--link:#69727d}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--sub:#c3d0dc;--mute:#9fb1c3;--box:#161b22;--hl:#1f3550;--line:#5f7f9f;--arrow:#8aa4bd;--gt:#6fb0dc;--rm:#e59a78;--gtfill:#2a4259;--node:#6fa3c9;--guide:#4a6178;--link:#8b96a3}}
.t{font-family:Arial,sans-serif}.ink{fill:var(--ink)}.sub{fill:var(--sub)}.mute{fill:var(--mute)}
.box{fill:var(--box);stroke:var(--line);stroke-width:2}.hl{fill:var(--hl);stroke:var(--line);stroke-width:2}
.arr{stroke:var(--arrow);stroke-width:2;fill:none}.arrf{fill:var(--arrow)}
.gts{stroke:var(--gt);fill:none}.rms{stroke:var(--rm);fill:none}.gtf{fill:var(--gt)}.rmf{fill:var(--rm)}
</style><g class="t" text-anchor="middle"><text class="ink" x="500" y="40" font-size="23" font-weight="bold">How the Code Works</text><rect class="box" x="17" y="100" width="124" height="90" rx="12"/><text class="ink" x="79" y="138" font-size="14" font-weight="bold">Input</text><text class="mute" x="79" y="162" font-size="11">GT + RM (.stl)</text><path class="arr" d="M 142 145 h 14" marker-end="url(#a)"/><rect class="box" x="158" y="100" width="124" height="90" rx="12"/><text class="ink" x="220" y="138" font-size="14" font-weight="bold">Normalization</text><text class="mute" x="220" y="162" font-size="11">center and scale</text><path class="arr" d="M 283 145 h 14" marker-end="url(#a)"/><rect class="hl" x="299" y="100" width="124" height="90" rx="12"/><text class="ink" x="361" y="138" font-size="14" font-weight="bold">Check</text><text class="mute" x="361" y="162" font-size="11">MSE ≥ threshold?</text><path class="arr" d="M 424 145 h 14" marker-end="url(#a)"/><rect class="hl" x="440" y="100" width="124" height="90" rx="12"/><text class="ink" x="502" y="138" font-size="14" font-weight="bold">Alignment</text><text class="mute" x="502" y="162" font-size="11">similarity ICP</text><path class="arr" d="M 565 145 h 14" marker-end="url(#a)"/><rect class="box" x="581" y="100" width="124" height="90" rx="12"/><text class="ink" x="643" y="138" font-size="14" font-weight="bold">Geometry Metrics</text><text class="mute" x="643" y="158" font-size="11"><tspan x="643" dy="0">MSE · Chamfer</tspan><tspan x="643" dy="15">Hausdorff</tspan></text><path class="arr" d="M 706 145 h 14" marker-end="url(#a)"/><rect class="box" x="722" y="100" width="124" height="90" rx="12"/><text class="ink" x="784" y="138" font-size="14" font-weight="bold">Image Metrics</text><text class="mute" x="784" y="162" font-size="11">LPIPS · PSNR · SSIM</text><path class="arr" d="M 847 145 h 14" marker-end="url(#a)"/><rect class="box" x="863" y="100" width="124" height="90" rx="12"/><text class="ink" x="925" y="138" font-size="14" font-weight="bold">Results</text><text class="mute" x="925" y="162" font-size="11">CSV · PLY · PNG</text><text class="mute" x="500" y="240" font-size="15">If normalized MSE exceeds the threshold, ICP aligns the meshes before metric calculation; otherwise, the original pose is kept.</text></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrf" d="M0 0L7 3.5L0 7"/></marker></defs></svg>
