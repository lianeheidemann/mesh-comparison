<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Mudanças nas métricas em relação ao conjunto antigo</title>
<desc id="desc">Comparação entre o protocolo antigo de vértice a vértice e o protocolo atual por superfície, com HD95, métricas de cobertura, análise multivista e PSNR corrigido.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#54758c"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1d3448}
    .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#526b7e}
    .label{font-size:14px;font-weight:700;letter-spacing:.6px}
    .head{font-size:17px;font-weight:700}.body{font-size:15px;fill:#425c70}
    .muted{font-size:14px;fill:#607789}
  </style>
</defs>
<rect width="1200" height="700" rx="24" fill="#f3f7fa"/>
<text x="48" y="58" class="title">O que mudou em relação ao código antigo</text>
<text x="48" y="88" class="sub">O protocolo atual troca medidas sensíveis à malha por comparações de superfície e acrescenta cobertura.</text>

<rect x="48" y="125" width="495" height="432" rx="20" fill="#fff" stroke="#d5dfe6" stroke-width="2"/>
<rect x="48" y="125" width="495" height="62" rx="20" fill="#e9eef2"/>
<text x="76" y="164" class="label" fill="#526b7e">CÓDIGO ANTIGO</text>
<text x="76" y="225" class="head">Vértice ↔ vértice</text>
<text x="76" y="250" class="body">Resultado dependia da densidade e da triangulação.</text>
<line x1="76" y1="270" x2="515" y2="270" stroke="#e1e8ed"/>
<text x="76" y="304" class="head">Hausdorff máximo</text>
<text x="76" y="329" class="body">Um ponto extremo podia dominar a medida.</text>
<line x1="76" y1="349" x2="515" y2="349" stroke="#e1e8ed"/>
<text x="76" y="383" class="head">Chamfer e RMSE entre vértices</text>
<text x="76" y="408" class="body">A cobertura das partes ausentes não era</text>
<text x="76" y="430" class="body">apresentada com precisão e recall.</text>
<line x1="76" y1="451" x2="515" y2="451" stroke="#e1e8ed"/>
<text x="76" y="486" class="head">PSNR calculado sobre N</text>
<text x="76" y="511" class="body">Denominador diferente do padrão RGB de 3N.</text>

<path d="M563 340 H632" fill="none" stroke="#54758c" stroke-width="4" marker-end="url(#arrow)"/>
<text x="571" y="320" class="label" fill="#356f91">REVISÃO</text>

<rect x="657" y="125" width="495" height="432" rx="20" fill="#fff" stroke="#9fcfc5" stroke-width="2"/>
<rect x="657" y="125" width="495" height="62" rx="20" fill="#e2f2ef"/>
<text x="685" y="164" class="label" fill="#18877b">PROTOCOLO ATUAL</text>
<text x="685" y="225" class="head">Amostras de superfície → triângulos</text>
<text x="685" y="250" class="body">Reduz a dependência da triangulação da malha.</text>
<line x1="685" y1="270" x2="1124" y2="270" stroke="#e1e8ed"/>
<text x="685" y="304" class="head">HD95</text>
<text x="685" y="329" class="body">Percentil 95 robusto a um extremo isolado.</text>
<line x1="685" y1="349" x2="1124" y2="349" stroke="#e1e8ed"/>
<text x="685" y="383" class="head">Precisão + recall + F-score</text>
<text x="685" y="408" class="body">Mede proximidade e cobertura em tolerâncias τ.</text>
<line x1="685" y1="429" x2="1124" y2="429" stroke="#e1e8ed"/>
<text x="685" y="464" class="head">Curva F(τ) + AUC-F + NC</text>
<text x="685" y="489" class="body">Compara tolerâncias e orientação local.</text>
<line x1="685" y1="510" x2="1124" y2="510" stroke="#e1e8ed"/>
<text x="685" y="541" class="body">PSNR usa os 3N canais RGB da máscara.</text>

<rect x="48" y="585" width="1104" height="76" rx="16" fill="#e4eef5"/>
<text x="76" y="618" class="label" fill="#356f91">AVALIAÇÃO PERCEPTUAL EM PARALELO</text>
<text x="76" y="644" class="body">Vistas renderizadas alinhadas → união das máscaras → PSNR / SSIM / LPIPS. SSIM ↑; LPIPS ↓.</text>
</svg>